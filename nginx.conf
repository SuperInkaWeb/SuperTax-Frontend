server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta desconocida cae en index.html (router del cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache larga para assets con hash; el index.html nunca se cachea.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
